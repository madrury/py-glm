[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "py-glm"
version = "0.1.0"
description = "Fitting, inspecting, and evaluating generalized linear models."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Matthew Drury", email = "matthew.drury.83@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2.3",
    "patsy>=1.0",
    "scipy>=1.14.1",
]

[project.urls]
Repository = "https://github.com/madrury/py-glm"

[dependency-groups]
dev = [
    "jupyter",
    "matplotlib",
    "pytest",
    "scikit-learn",
    "statsmodels>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["glm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
